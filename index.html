<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سؤال الأسبوع - هي منه وهو منها</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#0b5c39; --emerald-l:#158a56; --emerald-d:#083d26;
  --gold:#c6a13a; --gold-l:#e3c672; --gold-d:#a1801f;
  --cream:#faf7ee; --card:#ffffff; --ink:#22281f;
  --correct:#2f9d5c; --wrong:#c8483a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--cream:#0f1512;--card:#1a221c;--ink:#f0eee1;}
}
:root[data-theme="dark"]{--cream:#0f1512;--card:#1a221c;--ink:#f0eee1;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Tajawal',sans-serif;color:var(--ink);min-height:100vh;
  background:var(--cream);padding:36px 16px 70px;}

.header{text-align:center;max-width:640px;margin:0 auto 34px;display:flex;flex-direction:column;align-items:center;}
.logo-ring{width:118px;height:118px;border-radius:50%;margin-bottom:16px;
  box-shadow:0 8px 22px rgba(11,92,57,.22);overflow:hidden;}
.logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
.header h1{color:var(--emerald-d);font-family:'Amiri',serif;font-size:2.1rem;font-weight:700;margin:0 0 4px;}
.header .sub{color:var(--gold-d);font-weight:700;font-size:1.02rem;margin:0;}
.header .rule{width:64px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:12px 0 10px;border-radius:2px;}
.header p{font-size:.88rem;opacity:.7;line-height:1.7;margin:0;max-width:420px;}

.wrap{max-width:600px;margin:0 auto;}
.progress{display:flex;gap:8px;justify-content:center;margin-bottom:22px;}
.dot{width:9px;height:9px;border-radius:50%;background:#e3ddc6;transition:all .35s cubic-bezier(.4,0,.2,1);}
.dot.done{background:var(--gold);}
.dot.active{background:var(--emerald);width:22px;border-radius:5px;}

@keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--card);border-radius:18px;padding:30px 28px;position:relative;
  box-shadow:0 10px 30px rgba(11,92,57,.1);border:1px solid rgba(198,161,58,.3);
  animation:riseIn .45s cubic-bezier(.4,0,.2,1);}
.card .topbar{position:absolute;top:0;right:0;left:0;height:5px;border-radius:18px 18px 0 0;
  background:linear-gradient(90deg,var(--emerald),var(--gold));}
.qnum{display:inline-block;color:var(--emerald-d);font-weight:700;font-size:.8rem;
  border:1.5px solid var(--emerald);border-radius:20px;padding:4px 14px;margin-bottom:16px;}
.qtext{font-weight:700;font-size:1.22rem;margin:0 0 20px;line-height:1.65;color:var(--ink);}
.opts{display:grid;gap:11px;}
.opt{background:var(--cream);border:1.5px solid #e3ddc6;border-radius:12px;padding:13px 16px;
  cursor:pointer;font-family:inherit;font-size:1rem;text-align:right;color:var(--ink);
  transition:transform .2s cubic-bezier(.4,0,.2,1), background .25s, border-color .25s, box-shadow .25s;
  display:flex;align-items:center;justify-content:space-between;}
.opt:hover{border-color:var(--gold);background:#fff;transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(198,161,58,.22);}
.opt .mark{opacity:0;transition:opacity .25s;font-weight:700;}
.opt.correct{background:var(--correct);border-color:var(--correct);color:#fff;font-weight:700;transform:none;}
.opt.correct .mark{opacity:1;}
.opt.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff;transform:none;}
.opt.wrong .mark{opacity:1;}
.opt.disabled{cursor:default;}
.opt.disabled:hover{transform:none;box-shadow:none;}
.hint{text-align:center;margin-top:16px;font-size:.85rem;opacity:.55;}

.cert-gate{max-width:440px;margin:0 auto;text-align:center;}
.cert-gate input{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--gold);
  font-family:inherit;font-size:1rem;margin:16px 0;text-align:center;background:var(--cream);color:var(--ink);
  transition:border-color .2s, box-shadow .2s;}
.cert-gate input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(11,92,57,.12);}
.btn{background:var(--emerald);color:#fff;border:none;border-radius:11px;
  padding:13px 32px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;
  transition:background .25s, transform .2s, box-shadow .2s;box-shadow:0 6px 16px rgba(11,92,57,.25);}
.btn:hover{background:var(--emerald-l);transform:translateY(-2px);box-shadow:0 9px 20px rgba(11,92,57,.32);}
.score-line{font-weight:800;color:var(--emerald-d);margin-bottom:8px;font-size:1.15rem;}

.certificate{max-width:920px;margin:0 auto;background:var(--card);border-radius:14px;
  box-shadow:0 16px 44px rgba(11,92,57,.18);animation:riseIn .5s cubic-bezier(.4,0,.2,1);
  padding:46px 60px 36px;text-align:center;}
.certificate .cert-logo{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 12px;
  display:block;box-shadow:0 4px 10px rgba(0,0,0,.12);}
.certificate .org-ar{color:var(--emerald-d);font-weight:900;font-size:1.02rem;}
.certificate .org-en{color:var(--gold-d);font-weight:700;font-size:.74rem;letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:18px;}
.certificate .title{font-family:'Amiri',serif;font-size:2.3rem;font-weight:700;margin:4px 0 20px;
  color:var(--emerald-d);}
.certificate .lead{font-size:1rem;opacity:.8;}
.certificate .name{font-family:'Amiri',serif;font-size:1.9rem;color:var(--emerald-d);font-weight:700;
  margin:12px auto 18px;border-bottom:2.5px solid var(--gold);display:table;padding:0 16px 8px;}
.certificate .desc{font-size:1rem;line-height:2;max-width:600px;margin:0 auto 20px;color:var(--ink);}
.certificate .grade{display:table;margin:0 auto 24px;background:var(--emerald);color:#fff;font-weight:700;
  border-radius:20px;padding:8px 28px;font-size:1rem;}
.certificate .footer{display:flex;justify-content:center;gap:90px;margin-top:24px;font-size:.85rem;}
.certificate .footer div{text-align:center;}
.certificate .sigline{border-top:1.5px solid var(--gold-d);padding-top:8px;min-width:170px;}
.certificate .sig-name{font-family:'Amiri',serif;font-size:1.1rem;color:var(--emerald-d);font-weight:700;}
.certificate .sig-title{font-size:.78rem;opacity:.7;margin-top:2px;}
.certificate .serial{margin-top:22px;font-size:.75rem;opacity:.55;letter-spacing:.5px;}
.actions{text-align:center;margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn-outline{background:transparent;color:var(--emerald);border:1.5px solid var(--emerald);box-shadow:none;
  text-decoration:none;display:inline-block;}
.btn-outline:hover{background:var(--emerald);color:#fff;}
.restore-banner{text-align:center;background:var(--card);border:1px solid rgba(198,161,58,.4);
  border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:.88rem;color:var(--ink);}
.restore-banner b{color:var(--emerald-d);}
.restore-banner span{color:var(--emerald);font-weight:700;text-decoration:underline;cursor:pointer;}
.restore-banner span + span{color:var(--gold-d);}
@media (max-width:640px){
  .certificate{padding:30px 18px 26px;border-radius:10px;}
  .certificate .title{font-size:1.6rem;margin:4px 0 14px;}
  .certificate .name{font-size:1.3rem;margin:8px auto 14px;}
  .certificate .desc{font-size:.88rem;line-height:1.8;margin-bottom:16px;}
  .certificate .org-ar{font-size:.85rem;}
  .certificate .org-en{font-size:.62rem;margin-bottom:12px;}
  .certificate .grade{font-size:.88rem;padding:6px 20px;margin-bottom:16px;}
  .certificate .footer{gap:26px;flex-wrap:wrap;}
  .certificate .sigline{min-width:120px;}
  .certificate .sig-name{font-size:.92rem;}
}
@media print{
  .header,.progress,.actions,.hint{display:none !important;}
  body{background:#fff;padding:0;}
  .certificate{box-shadow:none;}
}
</style>
</head>

  <div class="sub">مبادرة «هي منه وهو منها»</div>

</div>

<div class="wrap">
  <div class="progress" id="progress"></div>
  <div id="stage"></div>
</div>

const questions = [
 {q:"أكبر قارة في العالم من حيث المساحة؟", opts:["أفريقيا","آسيا","أمريكا الشمالية","أوروبا"], correct:1},
 {q:"ما عاصمة أستراليا؟", opts:["سيدني","ملبورن","كانبرا","بريزبن"], correct:2},
 {q:"كم عدد كواكب المجموعة الشمسية؟", opts:["7 كواكب","8 كواكب","9 كواكب","10 كواكب"], correct:1},
 {q:"ما الكوكب المعروف بالكوكب الأحمر؟", opts:["الأرض","المريخ","الزهرة","عطارد"], correct:1},
 {q:"ما الحضارة التي اشتهرت بالكتابة المسمارية؟", opts:["الفرعونية","السومرية","الإغريقية","الفينيقية"], correct:1},
 {q:"من مؤلف كتاب «مقدمة ابن خلدون» ومؤسس علم الاجتماع الحديث؟", opts:["الجاحظ","ابن سينا","ابن خلدون","المتنبي"], correct:2},
 {q:"من الملقب بشاعر النيل؟", opts:["أحمد شوقي","حافظ إبراهيم","المتنبي","البارودي"], correct:1},
 {q:"ما أكبر محيط في العالم؟", opts:["المحيط الهندي","المحيط الأطلسي","المحيط المتجمد الشمالي","المحيط الهادئ"], correct:3},
];

let current = 0, score = 0;
const stage = document.getElementById('stage');
const progress = document.getElementById('progress');

function beep(correct){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = correct ? 'sine' : 'square';
    o.frequency.value = correct ? 880 : 160;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (correct?0.35:0.45));
    o.start(); o.stop(ctx.currentTime + (correct?0.35:0.45));
    if(correct){
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type='sine'; o2.frequency.value=1320;
      g2.gain.setValueAtTime(0.12, ctx.currentTime+0.12);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
      o2.start(ctx.currentTime+0.12); o2.stop(ctx.currentTime+0.4);
    }
  }catch(e){}
}

function renderProgress(){
  progress.innerHTML = '';
  questions.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < current ? ' done' : i === current ? ' active' : '');
    progress.appendChild(d);
  });
}

function renderQuestion(){
  renderProgress();
  const item = questions[current];
  const letters = ['أ','ب','ج','د'];
  stage.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  const topbar = document.createElement('div'); topbar.className = 'topbar';
  const num = document.createElement('div');
  num.className = 'qnum'; num.textContent = 'سؤال ' + (current+1) + ' من ' + questions.length;
  const qt = document.createElement('p');
  qt.className = 'qtext'; qt.textContent = item.q;
  const opts = document.createElement('div');
  opts.className = 'opts';

  item.opts.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span>' + letters[oi] + ') ' + optText + '</span><span class="mark"></span>';
    btn.addEventListener('click', () => {
      if(btn.dataset.locked) return;
      const allBtns = opts.querySelectorAll('.opt');
      allBtns.forEach(b => { b.dataset.locked = '1'; b.classList.add('disabled'); });
      if(oi === item.correct){
        btn.classList.add('correct'); btn.querySelector('.mark').textContent = '✓'; beep(true); score++;
      } else {
        btn.classList.add('wrong'); btn.querySelector('.mark').textContent = '✗';
        const correctBtn = allBtns[item.correct];
        correctBtn.classList.add('correct'); correctBtn.querySelector('.mark').textContent = '✓';
        beep(false);
      }
      setTimeout(() => {
        current++;
        if(current < questions.length){ renderQuestion(); } else { renderCertGate(); }
      }, 1100);
    });
    opts.appendChild(btn);
  });

  card.appendChild(topbar); card.appendChild(num); card.appendChild(qt); card.appendChild(opts);
  stage.appendChild(card);
  const hint = document.createElement('div');
  hint.className = 'hint'; hint.textContent = 'اختاري إجابتك وهينتقل تلقائيًا للسؤال التالي';
  stage.appendChild(hint);
}

function gradeFor(pct){
  if(pct >= 90) return 'ممتاز';
  if(pct >= 75) return 'جيد جدًا';
  if(pct >= 60) return 'جيد';
  return 'مقبول';
}

function nextSerial(){
  try{
    let n = parseInt(localStorage.getItem('weeosu_cert_seq') || '0', 10) + 1;
    localStorage.setItem('weeosu_cert_seq', String(n));
    const year = new Date().getFullYear();
    return 'WEEOSU-' + year + '-' + String(n).padStart(4,'0');
  }catch(e){
    return 'WEEOSU-' + new Date().getFullYear() + '-0001';
  }
}

function saveLastCert(record){
  try{ localStorage.setItem('weeosu_last_cert', JSON.stringify(record)); }catch(e){}
}
function loadLastCert(){
  try{
    const raw = localStorage.getItem('weeosu_last_cert');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function renderCertGate(){
  progress.innerHTML = '';
  const pct = Math.round((score/questions.length)*100);
  stage.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'cert-gate';
  box.innerHTML = `
    <div class="card">
      <div class="topbar"></div>
      <div class="score-line">نتيجتك: ${score} من ${questions.length} (${pct}%)</div>
      <p style="opacity:.7;font-size:.92rem;margin-bottom:0;">اكتبي اسمك بالكامل لإصدار شهادة المشاركة</p>
      <input id="nameInput" type="text" placeholder="الاسم بالكامل">
      <br><button class="btn" id="genCert">إصدار الشهادة</button>
    </div>`;
  stage.appendChild(box);
  document.getElementById('genCert').addEventListener('click', () => {
    const name = document.getElementById('nameInput').value.trim();
    if(!name){ document.getElementById('nameInput').focus(); return; }
    const record = {
      name, score, total: questions.length, pct, grade: gradeFor(pct),
      date: new Date().toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'}),
      serial: nextSerial()
    };
    saveLastCert(record);
    renderCertificate(record);
  });
}

function renderCertificate(record){
  document.getElementById('siteHeader').style.display = 'none';
  stage.innerHTML = '';
  const cert = document.createElement('div');
  cert.className = 'certificate';
  cert.innerHTML = `
    <img class="cert-logo" src="${LOGO_SRC}" alt="الشعار">
    <div class="org-ar">وحدة تمكين المرأة ودعم تكافؤ الفرص - جامعة الأزهر</div>
    <div class="org-en">Women's Empowerment &amp; Equal Opportunities Support Unit</div>
    <div class="title">شهادة تقدير</div>
    <div class="lead">تتشرف وحدة تمكين المرأة ودعم تكافؤ الفرص بجامعة الأزهر بمنح هذه الشهادة إلى</div>
    <div class="name">${record.name}</div>
    <div class="desc">تقديرًا لمشاركتها المتميزة في «سؤال الأسبوع» ضمن مبادرة «هي منه وهو منها»،
      وحرصها على المعرفة والتفكير، بعد تحقيقها نتيجة ${record.score} من ${record.total} (${record.pct}٪).</div>
    <div class="grade">التقدير: ${record.grade}</div>
    <div class="footer">
      <div class="sigline"><div class="sig-name">${record.date}</div><div class="sig-title">التاريخ</div></div>
      <div class="sigline"><div class="sig-name">أ.د/ مها أبوشادي</div><div class="sig-title">المدير التنفيذي للوحدة</div></div>
    </div>
    <div class="serial">رقم الشهادة: ${record.serial}</div>`;
  stage.appendChild(cert);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const shareText = 'حصلت على تقدير ' + record.grade + ' في «سؤال الأسبوع» ضمن مبادرة «هي منه وهو منها» - وحدة تمكين المرأة بجامعة الأزهر ✨';
  const waHref = 'https://wa.me/?text=' + encodeURIComponent(shareText);
  actions.innerHTML = `
    <button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    <a class="btn btn-outline" href="${waHref}" target="_blank" rel="noopener noreferrer">📤 مشاركة واتساب</a>
    <button class="btn btn-outline" id="restartBtn">🔄 حل الاختبار من جديد</button>`;
  stage.appendChild(actions);
  document.getElementById('restartBtn').addEventListener('click', resetQuiz);
}

function resetQuiz(){
  current = 0; score = 0;
  document.getElementById('siteHeader').style.display = '';
  const existingBanner = document.querySelector('.restore-banner');
  if(existingBanner) existingBanner.remove();
  renderQuestion();
}

function renderRestoreBanner(){
  const record = loadLastCert();
  if(!record) return;
  const banner = document.createElement('div');
  banner.className = 'restore-banner';
  banner.innerHTML = `لديك شهادة صادرة باسم <b>${record.name}</b> — <span id="restoreLink">عرض الشهادة</span> · <span id="dismissLink">بدء اختبار جديد</span>`;
  document.querySelector('.wrap').insertBefore(banner, document.getElementById('progress'));
  document.getElementById('restoreLink').addEventListener('click', () => {
    document.getElementById('siteHeader').style.display = 'none';
    document.getElementById('progress').innerHTML = '';
    banner.remove();
    renderCertificate(record);
  });
  document.getElementById('dismissLink').addEventListener('click', () => { banner.remove(); });
}

renderRestoreBanner();
renderQuestion();
</script>
</body>
</html>
